[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-q"
version = "0.1.0"
description = "Python client for Arduino router MessagePack-RPC over a Unix socket"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
    { name = "Nikola Academy" }
]
keywords = ["arduino", "msgpack", "rpc", "unix-socket"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
]
dependencies = [
    "msgpack>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Nikola-Academy/bridge-q"
Repository = "https://github.com/Nikola-Academy/bridge-q"

[tool.setuptools.packages.find]
where = ["src"]
